<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="เกมจับคู่การ์ดสัตว์ประหลาดสุดน่ารักในธีมสีพาสเทลสว่าง เล่นสนุก ฝึกสมอง รองรับทุกหน้าจอ">
  <title>Pastel Spooky Match - เกมจับคู่การ์ดสัตว์ประหลาดพาสเทล</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game-container">
    <!-- Header & Scoreboard Section -->
    <header class="game-header">
      <h1 class="game-title" id="main-title">
        <span>👻</span><span>Spooky</span><span>Match</span>
      </h1>
      
      <!-- Stats Display Grid -->
      <section class="stats-panel" aria-label="ข้อมูลการเล่น">
        <div class="stat-box">
          <span class="stat-label">การจับคู่ (Moves)</span>
          <span class="stat-value" id="moves-counter">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">เวลาที่ใช้ (Time)</span>
          <span class="stat-value" id="timer-display">00:00</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">สถิติการคู่ต่ำสุด</span>
          <span class="stat-value" id="best-moves-display">-</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">สถิติเวลาดีที่สุด</span>
          <span class="stat-value" id="best-time-display">-</span>
        </div>
      </section>

      <!-- Action Buttons -->
      <nav class="controls-panel" aria-label="ควบคุมเกม">
        <button id="restart-btn" class="btn btn-primary" aria-label="เริ่มเกมใหม่">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"></path>
          </svg>
          เริ่มเกมใหม่
        </button>
        <button id="sound-btn" class="btn btn-secondary btn-icon" aria-label="เปิดปิดเสียง">
          <svg id="sound-on-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z"></path>
          </svg>
          <svg id="sound-off-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display: none;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75L19.5 12m0 0l2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6L4.5 10.5m0 0L2.25 12.75M4.5 10.5l2.25 2.25M4.5 10.5L2.25 8.25m8.25 8.25l4.72 4.72a.75.75 0 001.28-.53V3.56a.75.75 0 00-1.28-.53l-4.72 4.72H8.25"></path>
          </svg>
        </button>
      </nav>
    </header>

    <!-- Game Board -->
    <section id="game-grid" class="game-grid" aria-label="กระดานจับคู่การ์ด"></section>
  </main>

  <!-- Victory Pop-up Modal -->
  <dialog id="victory-modal" class="modal-overlay" aria-modal="true">
    <div class="modal-content">
      <div class="modal-icon">🎉</div>
      <h2 class="modal-title">สุดยอดไปเลย!</h2>
      <p class="modal-message">คุณสามารถปราบและจับคู่เหล่าสัตว์ประหลาดพาสเทลได้สำเร็จแล้ว!</p>
      
      <div class="modal-stats">
        <div class="modal-stat-row">
          <span>จำนวนการจับคู่ที่ใช้ (Moves):</span>
          <span class="modal-stat-value" id="modal-moves">0</span>
        </div>
        <div class="modal-stat-row">
          <span>เวลาที่ใช้ทั้งหมด (Time):</span>
          <span class="modal-stat-value" id="modal-time">00:00</span>
        </div>
        <div class="modal-stat-row" id="new-record-row" style="display: none; justify-content: center; margin-top: 8px;">
          <span class="new-record-badge">🏆 ทำลายสถิติใหม่!</span>
        </div>
      </div>
      
      <button id="play-again-btn" class="btn btn-primary" style="width: 100%;">
        เล่นอีกครั้ง 🎮
      </button>
    </div>
  </dialog>

  <!-- Game Logic Script -->
  <script src="app.js"></script>
</body>
</html>
